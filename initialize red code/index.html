<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div id="login-form" class="form-box">
            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button onclick="login()">Login</button>
            <p>Don't have an account? <a href="#" onclick="toggleForm()">Register</a></p>
        </div>
        <div id="register-form" class="form-box hidden">
            <h2>Register</h2>
            <input type="text" id="register-username" placeholder="Username" required>
            <input type="password" id="register-password" placeholder="Password" required>
            <button onclick="register()">Register</button>
            <p>Already have an account? <a href="#" onclick="toggleForm()">Login</a></p>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <h2>Welcome, <span id="user-name"></span>!</h2>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        function toggleForm() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
        }

        function login() {
            let username = document.getElementById('login-username').value;
            document.getElementById('user-name').innerText = username;
            document.querySelector('.container').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        }

        function register() {
            alert('User registered! Now login.');
            toggleForm();
        }

        function logout() {
            document.querySelector('.container').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
    </script>

    <style>
        body {
            background-image: img;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: rgb(88, 134, 18);
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(82, 54, 54, 0.1);
            text-align: center;
        }

        .form-box {
            display: flex;
            flex-direction: column;
        }

        .form-box input {
            margin: 10px 0;
            padding: 10px;
        }

        .form-box button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</body>

</html>
